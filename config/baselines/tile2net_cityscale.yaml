# SegFormer segmentation + Tile2Net post-processing (no topology GNN).
# MODEL_TYPE: tile2net. The graph is built from the predicted mask at
# inference time (infer_single.py).

DATASET: 'cityscale'
MODEL_TYPE: 'tile2net'

# Segformer backbone settings
model_name: 'nvidia/segformer-b3-finetuned-ade-512-512'

# Data & graph
SEED: 42
PATCH_SIZE: 512
BATCH_SIZE: 8
MAX_DEPTH: 1
DATA_WORKER_NUM: 12
gt_graph_pattern: 3

# Training (segmentation only — no topology GNN)
TRAIN_EPOCHS: 25
BASE_LR: 0.0004
FREEZE_ENCODER: False
ENCODER_LR_FACTOR: 0.1
LR_SCHEDULE: cosine
WARMUP_FRACTION: 0.10
CKPT_MONITOR: val_mask_loss
CKPT_MODE: min
EARLY_STOP_MONITOR: val_mask_loss
EARLY_STOP_MODE: min
EARLY_STOP_PATIENCE: 10
MASK_LOSS_WEIGHT: 1.0
TOPO_LOSS_WEIGHT: 0.0                # Not used (no topology training)
MPS_FREEZE_BATCHNORM: True
MPS_REPLACE_BATCHNORM: True
FOCAL_LOSS_SEGMENTATION: False
EDGE_POS_WEIGHT: 3
balance_loss: False
Weighted_Sampling: False

# Topology (Tile2Net post-processing only)
TOPO_SAMPLE_NUM: 256
T2N_SNAP_TOL: 5.0                    # snap tolerance for centerline endpoints (metres)

# Inference
INFER_BATCH_SIZE: 8
SAMPLE_MARGIN: 0
INFER_PATCHES_PER_EDGE: 8
TOPO_THRESHOLD: 0.500
ROAD_NMS_RADIUS: 0
NEIGHBOR_RADIUS: 120
MAX_NEIGHBOR_QUERIES: 16
